repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pytest
        name: pytest (rápido)
        entry: bash -c 'cd backend && .venv/bin/pytest -q -x'
        language: system
        pass_filenames: false
        stages: [pre-push]
