name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunter/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: jobhunter
      # Scrapling se instala desde la carpeta hermana (igual que en el Dockerfile y en local).
      - name: Scrapling (fuente hermana)
        working-directory: .
        run: git clone --depth 1 https://github.com/D4Vinci/Scrapling.git Scrapling-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: jobhunter/backend/pyproject.toml
      - name: Instalar
        run: |
          pip install "../../Scrapling-main[fetchers]"
          pip install -e ".[dev,postgres]"
      - name: Chromium para los tests de auto-postulación (formularios reales)
        run: playwright install --with-deps chromium
      - name: ruff
        run: ruff check app tests
      - name: pytest (incluye migraciones == modelos)
        run: pytest -q

  frontend:
    name: Front (tipos, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunter/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: jobhunter
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobhunter/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/jobhunter
      - name: Scrapling (fuente hermana)
        working-directory: work
        run: git clone --depth 1 https://github.com/D4Vinci/Scrapling.git Scrapling-main
      - uses: docker/setup-buildx-action@v3
      - name: Build (contexto = work/)
        uses: docker/build-push-action@v6
        with:
          context: work
          file: work/jobhunter/backend/Dockerfile
          load: true
          tags: jobhunter-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arranque + /health
        run: |
          docker run -d --name jh -p 8000:8000 -e JH_JWT_SECRET="$(openssl rand -hex 32)" jobhunter-backend:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs jh; exit 1

  infra:
    name: Pulumi preview
    runs-on: ubuntu-latest
    needs: backend
    env:
      PULUMI_CONFIG_PASSPHRASE: ci
      PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi-state
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/jobhunter
      - name: Scrapling (fuente hermana)
        working-directory: work
        run: git clone --depth 1 https://github.com/D4Vinci/Scrapling.git Scrapling-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pulumi/actions@v6
      - name: Dependencias de Pulumi
        working-directory: work/jobhunter/infra
        run: python -m venv venv && venv/bin/pip install -r requirements.txt
      - name: preview local y vps (estado efímero, no despliega nada)
        working-directory: work/jobhunter/infra
        run: |
          pulumi stack init local && pulumi preview --stack local --non-interactive
          pulumi stack init vps
          pulumi config set --secret jobhunter:jwtSecret "$(openssl rand -base64 48)" --stack vps
          pulumi preview --stack vps --non-interactive
