  "Description": "\u003Cp\u003E\u003Cstrong\u003EAnalista de N\u0026oacute;mina\u003C/strong\u003E\u003C/p\u003E\u003Cp\u003E\u003Cbr\u003E\u003C/p\u003E\u003Cp\u003EObjetivo del puesto\u003C/p\u003E\u003Cp\u003EGestionar y procesar de manera correcta y oportuna las n\u0026oacute;minas asignadas, asegurando la adecuada integraci\u0026oacute;n de incidencias, percepciones, deducciones y movimientos ante las instituciones correspondientes, as\u0026iacute; como brindar atenci\u0026oacute;n y seguimiento a las necesidades de los colaboradores en materia de n\u0026oacute;mina.\u003C/p\u003E\u003Cp\u003EPrincipales responsabilidades\u003C/p\u003E\u003Cul\u003E\u003Cli\u003EProcesar y revisar \u003Cstrong\u003En\u0026oacute;minas semanales y quincenales\u003C/strong\u003E de diferentes filiales.\u003C/li\u003E\u003Cli\u003ERecibir, validar y capturar incidencias de n\u0026oacute;mina: faltas, incapacidades, vacaciones, permisos, horas extra, bonos, comisiones, descuentos y otras percepciones o deducciones.\u003C/li\u003E\u003Cli\u003ERealizar la revisi\u0026oacute;n y conciliaci\u0026oacute;n de la informaci\u0026oacute;n antes del cierre de cada n\u0026oacute;mina.\u003C/li\u003E\u003Cli\u003EValidar que los movimientos e incidencias reportados por las sucursales est\u0026eacute;n correctamente integrados al proceso de n\u0026oacute;mina.\u003C/li\u003E\u003Cli\u003EElaborar y revisar \u003Cstrong\u003Efiniquitos y liquidaciones\u003C/strong\u003E.\u003C/li\u003E\u003Cli\u003EGestionar y validar movimientos ante \u003Cstrong\u003EIMSS, INFONAVIT y FONACOT\u003C/strong\u003E.\u003C/li\u003E\u003Cli\u003ERealizar conciliaciones entre la informaci\u0026oacute;n de n\u0026oacute;mina, IMSS, SUA y sistemas internos.\u003C/li\u003E\u003Cli\u003EElaborar reportes relacionados con n\u0026oacute;mina, incidencias, movimientos de personal y costos de n\u0026oacute;mina.\u003C/li\u003E\u003Cli\u003EDar seguimiento a aclaraciones de los colaboradores relacionadas con pagos, percepcio nci\u0026oacute;n al detalle y precisi\u0026oacute;n num\u0026eacute;rica.\u003C/li\u003E\u003Cli\u003EOrganizaci\u0026oacute;n y seguimiento.\u003C/li\u003E\u003Cli\u003ECapacidad para trabajar con fechas l\u0026iacute;mite.\u003C/li\u003E\u003Cli\u003EAn\u0026aacute;lisis y soluci\u0026oacute;n de problemas.\u003C/li\u003E\u003Cli\u003EComunicaci\u0026oacute;n efectiva.\u003C/li\u003E\u003Cli\u003ETrabajo en equipo.\u003C/li\u003E\u003Cli\u003EOrientaci\u0026oacute;n al servicio interno.\u003C/li\u003E\u003C/ul\u003E\u003Cp\u003EOfrecemos\u003C/p\u003E\u003Cul\u003E\u003Cli\u003ESueldo competitivo.\u003C/li\u003E\u003Cli\u003EPrestaciones superiores a las de ley.\u003C/li\u003E\u003Cli\u003EContrataci\u0026oacute;n directa por la empresa.\u003C/li\u003E\u003Cli\u003EEstabilidad laboral.\u003C/li\u003E\u003Cli\u003EOportunidad de desarrollo profesional.\u003C/li\u003E\u003C/ul\u003E\u003Cp\u003E\u003Cstrong\u003EZona de trabajo:\u003C/strong\u003E Tlalnepantla\u003C/p\u003E\u003Cp\u003E\u003Cstrong\u003EHorario:\u003C/strong\u003E Lunes a viernes\u003C/p\u003E\u003Cp\u003ESi cuentas con experiencia en \u003Cstrong\u003En\u0026oacute;mina semanal y quincenal, manejo de incidencias y atenci\u0026oacute;n de diferentes centros de trabajo\u003C/strong\u003E, \u0026iexcl;queremos conocerte!\u003C/p\u003E",
